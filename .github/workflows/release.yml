name: Create Release from system.json

on:
  push:
    branches:
      - main
    # Only run this workflow if system.json is modified
    paths:
      - 'system.json'
  # Manual trigger — re-fire a release if GitHub drops the push trigger
  workflow_dispatch:
    inputs:
      foundry_dry_run:
        description: 'Foundry package release API: validate only, do not save'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Extract the version from system.json using jq
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(jq -r .version system.json)
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 2. Check if this tag already exists to prevent errors
      - name: Check if Tag Exists
        uses: mukunku/tag-exists-action@v1.6.0
        id: check_tag
        with:
          tag: 'v${{ steps.get_version.outputs.version }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Pin the download URL to THIS release's zip (not "latest")
      # ------------------------------------------------------------------
      # The download field must point at the version-specific asset so that
      # installing an older release (e.g. the latest V13-compatible one) pulls
      # that release's zip, not whatever GitHub currently marks as "latest".
      # manifest stays on "latest" so Foundry's update notifier keeps working.
      # ------------------------------------------------------------------
      - name: Pin download URL to this release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/system.zip"
          MANIFEST="https://github.com/${{ github.repository }}/releases/latest/download/system.json"
          tmp=$(mktemp)
          jq --arg dl "$DOWNLOAD" --arg mf "$MANIFEST" '.download = $dl | .manifest = $mf' system.json > "$tmp"
          mv "$tmp" system.json
          echo "Pinned download to: $DOWNLOAD"

      # 4. Build packs from source JSON files
      # ------------------------------------------------------------------
      # packs/*  (LevelDB binaries) are .gitignored; _source/ is the truth.
      # We install deps and compile _source/ → LevelDB before zipping.
      # ------------------------------------------------------------------
      - name: Setup Node
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: npm install

      - name: Build packs from source
        if: steps.check_tag.outputs.exists == 'false'
        run: node src/packs.mjs pack

      # 5. Create the Zip file (Only if tag doesn't exist)
      # ------------------------------------------------------------------
      # UPDATED: Zips only the folders shown in your image, ignoring dev files
      # Renamed to system.zip — includes the patched system.json above
      # ------------------------------------------------------------------
      - name: Zip Files
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          zip -r system.zip system.json assets css lang module templates packs --exclude 'packs/_source/*' --exclude 'packs/.gitattributes'

      # 4. Create Release
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: |
            system.zip
            system.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Publish the version to Foundry's package registry
      # ------------------------------------------------------------------
      # https://foundryvtt.com/article/package-release-api/
      # Runs after a fresh GitHub release, OR on a manual dispatch for a version
      # whose tag already exists (re-publish after a Foundry-side failure).
      # Needs repo secret FOUNDRY_RELEASE_TOKEN (the "Package Release Token" on
      # the package's foundryvtt.com edit page). Manifest must be the
      # version-pinned URL, not "latest". Compatibility is read from system.json.
      # Max one release per package per 60s -> retry once on 429.
      # ------------------------------------------------------------------
      - name: Publish to Foundry
        if: steps.check_tag.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.foundry_dry_run || false }}
        run: |
          if [ -z "$FOUNDRY_RELEASE_TOKEN" ]; then
            echo "::error::Secret FOUNDRY_RELEASE_TOKEN is not set"
            exit 1
          fi

          VERSION="${{ steps.get_version.outputs.version }}"
          REPO="${{ github.repository }}"

          BODY=$(jq -n \
            --arg id "$(jq -r .id system.json)" \
            --arg version "$VERSION" \
            --arg manifest "https://github.com/${REPO}/releases/download/v${VERSION}/system.json" \
            --arg notes "https://github.com/${REPO}/releases/tag/v${VERSION}" \
            --arg min "$(jq -r '.compatibility.minimum // ""' system.json)" \
            --arg ver "$(jq -r '.compatibility.verified // ""' system.json)" \
            --arg max "$(jq -r '.compatibility.maximum // ""' system.json)" \
            --argjson dry "$DRY_RUN" \
            '{id: $id, "dry-run": $dry, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: {minimum: $min, verified: $ver, maximum: $max}}}')
          echo "Request body:"; echo "$BODY"

          for attempt in 1 2; do
            HTTP=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST 'https://foundryvtt.com/_api/packages/release_version/' \
              -H 'Content-Type: application/json' \
              -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
              -d "$BODY" -D headers.txt)
            echo "HTTP $HTTP"; cat response.json; echo
            if [ "$HTTP" = "429" ] && [ "$attempt" = "1" ]; then
              WAIT=$(grep -i '^retry-after:' headers.txt | tr -dc '0-9')
              echo "Rate limited, waiting ${WAIT:-60}s"
              sleep "${WAIT:-60}"
              continue
            fi
            break
          done

          if [ "$HTTP" != "200" ]; then
            echo "::error::Foundry release API returned HTTP $HTTP"
            exit 1
          fi